# The account the line's steps run as. Argo needs to write step results (workflowtaskresults).
apiVersion: v1
kind: ServiceAccount
metadata: {name: factory, namespace: factory}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: factory-line, namespace: factory}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: factory-line, namespace: factory}
subjects: [{kind: ServiceAccount, name: factory, namespace: factory}]
roleRef: {kind: Role, name: factory-line, apiGroup: rbac.authorization.k8s.io}
