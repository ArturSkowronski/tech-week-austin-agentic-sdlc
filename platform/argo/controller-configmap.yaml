# The Argo controller for the workshop: no artifact repository (results go to the /work disk),
# pod logs, a small parallelism limit in the namespace (lesson 9 adds the WIP semaphore).
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
  namespace: argo
data:
  namespaceParallelism: "6"
  retentionPolicy: |
    completed: 20
    failed: 10
  # From a run on the floor straight to its trace: step spans (service factory-line) carry the tag factory.run.
  # JAEGER_URL is Jaeger's address in the browser: the codespace's forwarded port (scripts/cluster.sh, factory sync).
  links: |
    - name: Trace in Jaeger
      scope: workflow
      url: ${JAEGER_URL}/search?service=factory-line&lookback=2d&tags=%7B%22factory.run%22%3A%22${metadata.name}%22%7D
  executor: |
    resources:
      requests: {cpu: 10m, memory: 64Mi}
