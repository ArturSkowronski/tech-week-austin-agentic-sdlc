# Jaeger all-in-one (CNCF). kagent and the line send OTLP traces to 4317/4318; the UI on 16686 (localhost through the NodePort in kind.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: factory
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.11.0
          ports:
            - {containerPort: 16686, name: ui}
            - {containerPort: 4317, name: otlp-grpc}
            - {containerPort: 4318, name: otlp-http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: factory
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, nodePort: 30686}
    - {name: otlp-grpc, port: 4317}
    - {name: otlp-http, port: 4318}
