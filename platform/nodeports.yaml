# UI ports on localhost without port-forward: kind.yaml maps the NodePorts to host ports.
apiVersion: v1
kind: Service
metadata: {name: kagent-controller-nodeport, namespace: kagent}
spec:
  type: NodePort
  selector: {app.kubernetes.io/component: controller, app.kubernetes.io/instance: kagent, app.kubernetes.io/name: kagent}
  ports: [{name: http, port: 8083, targetPort: 8083, nodePort: 30083}]
---
apiVersion: v1
kind: Service
metadata: {name: kagent-ui-nodeport, namespace: kagent}
spec:
  type: NodePort
  selector: {app.kubernetes.io/component: ui, app.kubernetes.io/instance: kagent, app.kubernetes.io/name: kagent}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30082}]
---
apiVersion: v1
kind: Service
metadata: {name: argo-server-nodeport, namespace: argo}
spec:
  type: NodePort
  selector: {app: argo-server}
  ports: [{name: web, port: 2746, targetPort: 2746, nodePort: 30746}]
