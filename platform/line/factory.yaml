# The factory's production line (lesson 10). One run = one work order, attempts as a recursion of the `line` template:
#   📥 intake (spec, routing) → 🤖 builder (kagent over A2A or replay) → 📦 change (branch + patch in /work/out)
#   → 🧱 quality control ‖ 🔎 risk and review → ⚖️ decision: lights-out | 👤 human | 🔁 rework (attempt+1) | 🚨 andon
#   → 🔗 ledger (hash chain, cosign signature) + 🏭 work order card
# Run it: make order O=startle [AGENT=replay]. The graph and the logs: the floor (Argo UI).
# Finale (lessons/final-github.md): source=github. The work order is an issue, the result is a PR with the ledger and the
# first review, andon is a comment under the issue. Runs are started by the CronWorkflow factory-pull (platform/github/).
# Trace: Argo opens the run's trace, every step adds its span (sdlc/tracing.py), the kagent agent nests under its step.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: factory
  namespace: factory
spec:
  serviceAccountName: factory
  entrypoint: line
  # After the run, also after a failure: the root of the trace, and on GitHub the issue must not stay "in progress".
  onExit: finish
  # The WIP limit (lesson 9): the factory pulls, it does not push. Extra work orders wait in a queue on the semaphore.
  synchronization:
    semaphores:
      - configMapKeyRef: {name: factory-wip, key: wip}
  arguments:
    parameters:
      - {name: order, value: hw-001}
      - {name: agent, value: kagent}      # kagent | replay
      - {name: attempt, value: "1"}
      - {name: variant, value: ""}        # replay only: a recorded variant (make naive)
      - {name: source, value: file}       # file (orders/*.md, results in /work/out) | github (issue → PR)
  volumes:
    - name: work
      persistentVolumeClaim: {claimName: workshop}
    - name: cosign
      secret: {secretName: factory-cosign, optional: true}
  templates:
    - name: line
      inputs:
        parameters: [{name: order}, {name: agent}, {name: attempt}, {name: variant, value: ""}, {name: source, value: file}]
      steps:
        - - name: prepare
            template: prepare
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}, {name: source, value: "{{inputs.parameters.source}}"}]}
        - - name: intake
            template: intake
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}, {name: source, value: "{{inputs.parameters.source}}"}]}
        - - name: builder
            template: builder
            when: "{{steps.intake.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: agent, value: "{{inputs.parameters.agent}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}, {name: variant, value: "{{inputs.parameters.variant}}"}]}
        - - name: change
            template: change
            when: "{{steps.intake.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: agent, value: "{{inputs.parameters.agent}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}]}
        - - name: quality
            template: quality
            when: "{{steps.intake.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}]}
          - name: review
            template: review
            when: "{{steps.intake.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}]}
        - - name: decision
            template: decision
            when: "{{steps.intake.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}]}
        # On GitHub the human is the PR review: the line does not stop, the PR waits without auto-merge.
        - - name: human
            template: human
            when: "'{{steps.decision.outputs.parameters.decision}}' == 'human' && '{{inputs.parameters.source}}' == 'file'"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}]}
        - - name: ledger
            template: ledger
            when: "{{steps.intake.outputs.parameters.accepted}} == true"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}, {name: decision, value: "{{steps.decision.outputs.parameters.decision}}"}]}
        - - name: github
            template: github
            when: "'{{inputs.parameters.source}}' == 'github' && {{steps.intake.outputs.parameters.accepted}} == true && '{{steps.decision.outputs.parameters.decision}}' != 'rework'"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}, {name: decision, value: "{{steps.decision.outputs.parameters.decision}}"}]}
        - - name: result
            template: result
            when: "{{steps.intake.outputs.parameters.accepted}} == true && '{{steps.decision.outputs.parameters.decision}}' != 'rework'"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: attempt, value: "{{inputs.parameters.attempt}}"}, {name: decision, value: "{{steps.decision.outputs.parameters.decision}}"}]}
          # Rework = the same line, attempt + 1. A recursion of the template instead of a separate run: the whole history in one graph.
          - name: rework
            template: line
            when: "'{{steps.decision.outputs.parameters.decision}}' == 'rework'"
            arguments: {parameters: [{name: order, value: "{{inputs.parameters.order}}"}, {name: agent, value: "{{inputs.parameters.agent}}"}, {name: attempt, value: "{{=asInt(inputs.parameters.attempt) + 1}}"}, {name: variant, value: "{{inputs.parameters.variant}}"}, {name: source, value: "{{inputs.parameters.source}}"}]}

    # Quality control: deterministic, no model, out of the agent's reach. A red gate does not stop the others:
    # the factory wants the full picture before it decides. Mutation runs after the oracle.
    - name: quality
      inputs:
        parameters: [{name: order}, {name: attempt}]
      dag:
        tasks:
          - name: build
            template: step
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    set +e; bash sdlc/build.sh system > .sdlc/build.log 2>&1; code=$?; set -e
                    tail -n 30 .sdlc/build.log
                    python3 sdlc/gates.py report --log .sdlc/build.log --exit-code $code > "$OUT/quality-1-build.md"
                    set +e; python3 sdlc/gates.py weakening --base main --head HEAD > "$OUT/quality-2-weakening.md"; weak=$?; set -e
                    cat "$OUT/quality-1-build.md" "$OUT/quality-2-weakening.md"
                    echo "$code" > "$OUT/quality-1-build.exit"; echo "$weak" > "$OUT/quality-2-weakening.exit"
                    exit $((code + weak))
          - name: secrets
            template: step
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    set +e; gitleaks git --log-opts="main..HEAD" --redact --no-banner --no-color . > .sdlc/gitleaks.log 2>&1; code=$?; set -e
                    cat .sdlc/gitleaks.log
                    if [ $code -eq 0 ]; then printf '### 🔑 Secrets: ✅ gitleaks found nothing\n' > "$OUT/quality-3-secrets.md"
                    else printf '### 🔑 Secrets: ❌ gitleaks found a secret in the commits of the change\n' > "$OUT/quality-3-secrets.md"; fi
                    echo "$code" > "$OUT/quality-3-secrets.exit"; exit $code
          - name: oracle
            template: step
            dependencies: [build]
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    # Scenarios always from main, never from the change's branch: the agent cannot change them or add to them.
                    rm -rf scenarios && git checkout -q main -- scenarios
                    title=$(jq -r .title .sdlc/order.json)
                    set +e; python3 sdlc/scenarios.py run --work-order "$title" > "$OUT/quality-5-oracle.md"; code=$?; set -e
                    cat "$OUT/quality-5-oracle.md"; cp .sdlc/scenarios.json "$OUT/oracle.json"
                    git checkout -q -- scenarios 2>/dev/null || true
                    echo "$code" > "$OUT/quality-5-oracle.exit"; exit $code
          - name: mutation
            template: step
            dependencies: [oracle]
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    set +e; python3 sdlc/mutation.py --base main --head HEAD --threshold "$(jq -r '.gates.mutation_threshold // 50' sdlc/policy.json 2>/dev/null || echo 50)" > .sdlc/mutation.log 2>&1; code=$?; set -e
                    sed -n '/^### 🧬/,$p' .sdlc/mutation.log > "$OUT/quality-4-mutation.md"
                    [ -s "$OUT/quality-4-mutation.md" ] || { tail -n 20 .sdlc/mutation.log; printf '### 🧬 Mutation: ⚠️ no result\n' > "$OUT/quality-4-mutation.md"; }
                    cat "$OUT/quality-4-mutation.md"; echo "$code" > "$OUT/quality-4-mutation.exit"; exit $code

    # Code computes the risk, not a model (sdlc/risk.py). The level decides whether we ask the reviewer and whether the change waits for a human.
    - name: review
      inputs:
        parameters: [{name: order}, {name: attempt}]
      steps:
        - - name: run
            template: step
            continueOn: {failed: true}
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    mkdir -p /tmp/outputs; title=$(jq -r .title .sdlc/order.json)
                    python3 sdlc/risk.py --base main --head HEAD --agent --attempt "$ATTEMPT" --work-order "$title" > "$OUT/review-1-risk.md"
                    cp .sdlc/risk.json "$OUT/risk.json"; cp /tmp/outputs/needs_human "$OUT/needs_human"; cat "$OUT/review-1-risk.md"
                    set +e; python3 sdlc/review.py --base main --head HEAD --fail-on-blocking > /dev/null; code=$?; set -e
                    cp .sdlc/review.md "$OUT/review-2-review.md"; cp .sdlc/review.sarif "$OUT/review.sarif" 2>/dev/null || true
                    cat "$OUT/review-2-review.md"; echo "$code" > "$OUT/review.exit"; exit $code

    - name: decision
      inputs:
        parameters: [{name: order}, {name: attempt}]
      outputs:
        parameters:
          - name: decision
            valueFrom: {parameter: "{{steps.run.outputs.parameters.decision}}"}
      steps:
        - - name: run
            template: step-decision
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    max=$(jq -r '.line.max_attempts' sdlc/policy.json)
                    red=0; for f in "$OUT"/quality-*.exit; do [ "$(cat "$f")" = "0" ] || red=1; done
                    review=$(cat "$OUT/review.exit" 2>/dev/null || echo 1); needs_human=$(cat "$OUT/needs_human" 2>/dev/null || echo true)
                    vault=$(jq -r '.vault // "none"' "$OUT/oracle.json" 2>/dev/null || echo none)
                    reason=""
                    # A blocking review escalates to a human, not to a rework: the model advises, a human decides.
                    # Only the deterministic gates (quality control) force a rework.
                    [ "$review" = "0" ] || needs_human=true
                    if [ $red = 0 ]; then
                      if [ "$needs_human" = "true" ]; then decision="human"; else decision="lights-out"; fi
                    elif [ "$vault" = "failed" ]; then decision="andon"; reason="The vault failed (a rework for the vault would turn it into a training set)"
                    elif [ "$ATTEMPT" -ge "$max" ]; then decision="andon"; reason="$ATTEMPT attempts without passing quality control"
                    else decision="rework"; fi
                    echo "Decision: $decision ${reason:+($reason)}"; echo "$decision" > /tmp/outputs/decision
                    printf '%s\n' "$decision" > "$OUT/decision"; [ -z "$reason" ] || printf '%s\n' "$reason" > "$OUT/andon.md"
                    if [ "$decision" = "rework" ]; then python3 sdlc/factory.py feedback > "$OUT/feedback.md"; echo "--- report for the agent ---"; cat "$OUT/feedback.md"; fi

    # A human is a node with a role (lesson 9): the line stops (suspend), make approve records who and resumes.
    - name: human
      inputs:
        parameters: [{name: order}, {name: attempt}]
      steps:
        - - name: wait
            template: wait
        - - name: record
            template: step
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    who="{{steps.wait.outputs.parameters.who}}"
                    printf '### 👤 Approval: ✅ %s\n' "$who" > "$OUT/human.md"
                    printf 'human.approved %s\n' "$who" > "$OUT/human"; cat "$OUT/human.md"

    - name: wait
      suspend: {}
      outputs:
        parameters:
          - name: who
            valueFrom: {supplied: {}}

    # The ledger: every event of the attempt as a line with the hash of the previous one. Built deterministically from the
    # steps' results (gates, oracle, risk, decision, human) and from the agent's tool trace. Signed with the factory key (cosign, offline).
    - name: ledger
      inputs:
        parameters: [{name: order}, {name: attempt}, {name: decision}]
      steps:
        - - name: run
            template: step-sign
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    decision="{{inputs.parameters.decision}}"; L="--file $OUT/ledger.jsonl"; rm -f "$OUT/ledger.jsonl"
                    python3 sdlc/factory.py line-config > /dev/null
                    python3 sdlc/ledger.py $L append --type line.config --data "$(jq -c . .sdlc/line-config.json)"
                    trace=$(python3 sdlc/tracing.py url); [ -z "$trace" ] || python3 sdlc/ledger.py $L append --type trace --data "{\"url\": \"$trace\"}"
                    python3 sdlc/ledger.py $L append --type order.intake --data "$(jq -c '{accepted, problems}' .sdlc/intake.json)"
                    python3 sdlc/ledger.py $L append --type order.routed --data "$(jq -c --argjson a "$ATTEMPT" '{attempt: $a, "module": .module, reason, blast_radius, critical_in_radius}' .sdlc/route.json)"
                    python3 sdlc/ledger.py $L append --type agent.prompt --data "{\"agent\": \"$AGENT\", \"sha256\": \"$(sha256sum .sdlc/prompt.md | cut -d' ' -f1)\", \"bytes\": $(wc -c < .sdlc/prompt.md)}"
                    python3 sdlc/ledger.py $L ingest --source workshop --events "$OUT/tools.jsonl" > /dev/null
                    python3 sdlc/ledger.py $L ingest --source "$AGENT" --events "$OUT/agent-events.jsonl" > /dev/null
                    [ ! -s "$OUT/holdout-peek.jsonl" ] || python3 sdlc/ledger.py $L append --type holdout.peek --data "{\"count\": $(wc -l < "$OUT/holdout-peek.jsonl")}"
                    python3 sdlc/ledger.py $L append --type git.commit --data "{\"sha\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git branch --show-current)\", \"files\": $(git show --name-only --format= HEAD | jq -Rsc 'split("\n") | map(select(length > 0))')}"
                    for f in "$OUT"/quality-*.exit; do n=$(basename "$f" .exit); python3 sdlc/ledger.py $L append --type "gate.${n#quality-?-}" --data "{\"exit_code\": $(cat "$f")}"; done
                    [ ! -f "$OUT/oracle.json" ] || python3 sdlc/ledger.py $L append --type gate.oracle --data "$(jq -c '{covered, working_failed, vault}' "$OUT/oracle.json")"
                    [ ! -f "$OUT/risk.json" ] || python3 sdlc/ledger.py $L append --type review.risk --data "$(jq -c '{level, score, needs_human, autonomy}' "$OUT/risk.json")"
                    python3 sdlc/ledger.py $L append --type review.result --data "{\"exit_code\": $(cat "$OUT/review.exit" 2>/dev/null || echo 1)}"
                    python3 sdlc/ledger.py $L append --type order.decision --data "$(jq -nc --arg d "$decision" --arg r "$(cat "$OUT/andon.md" 2>/dev/null)" --argjson a "$ATTEMPT" '{decision: $d, reason: $r, attempt: $a}')"
                    if [ -f "$OUT/human" ]; then read -r kind who < "$OUT/human"; python3 sdlc/ledger.py $L append --type "$kind" --data "$(jq -nc --arg w "${who:-}" '{by: $w}')"; fi
                    final="$decision"; [ "$decision" != "human" ] || { grep -q human.approved "$OUT/human" 2>/dev/null && final="human" || final="waiting"; }
                    python3 sdlc/factory.py card --attempt "$ATTEMPT" --decision "$final" > "$OUT/card.md"
                    python3 sdlc/ledger.py $L append --type order.card --data "$(jq -c . .sdlc/card.json)"
                    python3 sdlc/ledger.py $L verify && python3 sdlc/ledger.py $L summary > "$OUT/ledger.md"
                    if [ -f /run/secrets/cosign/cosign.key ]; then
                      COSIGN_PASSWORD="" cosign sign-blob --yes --key /run/secrets/cosign/cosign.key --tlog-upload=false --use-signing-config=false \
                        --bundle "$OUT/ledger.sigstore.json" "$OUT/ledger.jsonl" 2>/dev/null && echo "ledger signed: $OUT/ledger.sigstore.json"
                    else echo "no cosign key (make cosign-keys): the ledger is not signed"; fi
                    cat "$OUT/card.md" "$OUT/ledger.md"

    - name: result
      inputs:
        parameters: [{name: order}, {name: attempt}, {name: decision}]
      steps:
        - - name: run
            template: step
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    decision="{{inputs.parameters.decision}}"
                    for f in "$OUT"/quality-*.exit; do c=$(cat "$f"); n=$(basename "$f" .exit); [ "$c" = "0" ] && echo "✅ $n" || echo "❌ $n (exit $c)"; done
                    [ "$(cat "$OUT/review.exit" 2>/dev/null)" = "0" ] && echo "✅ review" || echo "🚫 review: blocking findings (for a human to decide)"
                    cat "$OUT"/quality-*.md "$OUT"/review-*.md "$OUT"/human.md > "$OUT/report.md" 2>/dev/null || true
                    case "$decision" in
                      lights-out) echo "🌑 Accepted without a human (lights-out). Patch: $OUT/change.patch" ;;
                      human)      [ "$(cat "$OUT/human" 2>/dev/null)" = "human.approval_missing" ] && echo "👤 Needs a human, and the run did not wait (lesson 9)" || echo "👤 Accepted by a human" ;;
                      andon)      echo "🚨 Andon: the line stopped. $(cat "$OUT/andon.md" 2>/dev/null). The factory does not guess further: a human decides."; exit 1 ;;
                    esac

    - name: step-decision
      inputs:
        parameters: [{name: script}, {name: order}, {name: agent, value: kagent}, {name: attempt, value: "1"}]
      outputs:
        parameters:
          - name: decision
            valueFrom: {path: /tmp/outputs/decision, default: "andon"}
      container:
        image: factory-toolbox:lesson
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["mkdir -p /tmp/outputs; t0=$(date +%s%N); trap 'python3 sdlc/tracing.py step --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.script}}"]
        workingDir: /work/repo
        env:
          - {name: ORDER, value: "{{inputs.parameters.order}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.attempt}}"}
          - {name: FACTORY_RUN, value: "{{workflow.name}}"}
          - name: FACTORY_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: OUT, value: "/work/out/{{inputs.parameters.order}}/attempt-{{inputs.parameters.attempt}}"}
          - {name: OUTPUTS_DIR, value: /tmp/outputs}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        volumeMounts: [{name: work, mountPath: /work}]

    # Every step is the same image and the same disk. Only the script differs. The step that builds and tests the agent's
    # code has no secret: only the ledger (step-sign) sees the cosign key, only step-github sees the GitHub token.
    - name: step
      inputs:
        parameters: [{name: script}, {name: order}, {name: agent, value: kagent}, {name: attempt, value: "1"}]
      container:
        image: factory-toolbox:lesson
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["t0=$(date +%s%N); trap 'python3 sdlc/tracing.py step --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.script}}"]
        workingDir: /work/repo
        env:
          - {name: ORDER, value: "{{inputs.parameters.order}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.attempt}}"}
          - {name: FACTORY_RUN, value: "{{workflow.name}}"}
          - name: FACTORY_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: FACTORY_STEP, value: "{{pod.name}}"}
          - {name: OUT, value: "/work/out/{{inputs.parameters.order}}/attempt-{{inputs.parameters.attempt}}"}
          - {name: OUTPUTS_DIR, value: /tmp/outputs}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          - {name: KAGENT_URL, value: "http://kagent-controller.kagent.svc:8083"}
          - {name: KAGENT_NS, value: factory}
          - {name: A2A_USER, value: "line@factory"}
        volumeMounts: [{name: work, mountPath: /work}]
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 2Gi}

    # The ledger: the only step with the factory key. It runs no agent code, only sdlc/ and git.
    - name: step-sign
      inputs:
        parameters: [{name: script}, {name: order}, {name: agent, value: kagent}, {name: attempt, value: "1"}]
      container:
        image: factory-toolbox:lesson
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["t0=$(date +%s%N); trap 'python3 sdlc/tracing.py step --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.script}}"]
        workingDir: /work/repo
        env:
          - {name: ORDER, value: "{{inputs.parameters.order}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.attempt}}"}
          - {name: FACTORY_RUN, value: "{{workflow.name}}"}
          - name: FACTORY_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: FACTORY_STEP, value: "{{pod.name}}"}
          - {name: OUT, value: "/work/out/{{inputs.parameters.order}}/attempt-{{inputs.parameters.attempt}}"}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        volumeMounts: [{name: work, mountPath: /work}, {name: cosign, mountPath: /run/secrets/cosign, readOnly: true}]

    # Finale: the only steps with the GitHub token (the Secret factory-github from make github). They do not build agent
    # code: fetch, the ledger commit, push the branch, the PR and comments. Git without hooks, the token in a header (sdlc/github.py).
    - name: step-github
      inputs:
        parameters: [{name: script}, {name: order}, {name: agent, value: kagent}, {name: attempt, value: "1"}]
      container:
        image: factory-toolbox:lesson
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["t0=$(date +%s%N); trap 'python3 sdlc/tracing.py step --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.script}}"]
        workingDir: /work/repo
        env:
          - {name: ORDER, value: "{{inputs.parameters.order}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.attempt}}"}
          - {name: FACTORY_RUN, value: "{{workflow.name}}"}
          - name: FACTORY_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: OUT, value: "/work/out/{{inputs.parameters.order}}/attempt-{{inputs.parameters.attempt}}"}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          - name: GH_TOKEN
            valueFrom: {secretKeyRef: {name: factory-github, key: GH_TOKEN, optional: true}}
          - name: GH_REPO
            valueFrom: {secretKeyRef: {name: factory-github, key: GH_REPO, optional: true}}
        volumeMounts: [{name: work, mountPath: /work}]

    # Finale: the result of the line on GitHub. lights-out and human get a PR (the agent's branch + a commit with the ledger),
    # andon gets a comment under the issue. The ledger travels with the code: the `provenance` job checks it before merge.
    - name: github
      inputs:
        parameters: [{name: order}, {name: attempt}, {name: decision}]
      steps:
        - - name: run
            template: step-github
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    decision="{{inputs.parameters.decision}}"; issue="${ORDER#issue-}"
                    if [ "$decision" = "andon" ]; then
                      [ -s "$OUT/andon.md" ] || echo "The line stopped without passing quality control." > "$OUT/andon.md"
                      python3 sdlc/github.py andon --issue "$issue" --file "$OUT/andon.md"; exit 0
                    fi
                    mkdir -p ".factory/$ORDER"
                    for f in ledger.jsonl ledger.sigstore.json card.md; do [ ! -f "$OUT/$f" ] || cp "$OUT/$f" ".factory/$ORDER/"; done
                    git add .factory && git -c core.hooksPath=/dev/null commit -qm "factory: the ledger of work order $ORDER (attempt $ATTEMPT, $decision)"
                    python3 sdlc/github.py git push -q --force "{remote}" "agent/$ORDER"
                    python3 sdlc/github.py pr --issue "$issue" --out "$OUT" --decision "$decision"

    # After every run (onExit): the root of the work order's trace, and on GitHub an andon under the issue if the run failed without a decision.
    - name: finish
      steps:
        - - name: trace
            template: step
            arguments:
              parameters:
                - {name: order, value: "{{workflow.parameters.order}}"}
                - name: script
                  value: python3 sdlc/tracing.py root --start "{{workflow.creationTimestamp}}" --status "{{workflow.status}}" || true
          - name: github
            template: step-github
            when: "{{workflow.parameters.source}} == github"
            arguments:
              parameters:
                - {name: order, value: "{{workflow.parameters.order}}"}
                - name: script
                  value: python3 sdlc/github.py finish --issue "${ORDER#issue-}" --status "{{workflow.status}}" || true

    - name: prepare
      inputs:
        parameters: [{name: order}, {name: attempt}, {name: source, value: file}]
      steps:
        # Finale: the repo from GitHub (main there is the truth, also for the oracle) and the work order from the issue. Only this step has the token.
        - - name: github
            template: step-github
            when: "{{inputs.parameters.source}} == github"
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    mkdir -p "$OUT"
                    if [ "$ATTEMPT" = "1" ]; then
                      auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
                      [ -d .git ] || git init -q .
                      git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" -c core.hooksPath=/dev/null \
                        fetch -q "https://github.com/$GH_REPO.git" main
                      git -c core.hooksPath=/dev/null checkout -q -f -B main FETCH_HEAD && git clean -qfdx -e .sdlc
                      echo "main from github.com/$GH_REPO: $(git log --oneline -1)"
                    fi
                    python3 sdlc/github.py order --issue "${ORDER#issue-}" > "$OUT/order.json"
                    echo "issue #${ORDER#issue-}: $(jq -r .title "$OUT/order.json") ($(jq -r .url "$OUT/order.json"))"
        - - name: run
            template: step
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    # The work order's branch on the copy of the repo. Attempt 1 starts from main, a rework continues the branch.
                    git config user.name "agent[bot]"; git config user.email "agent@factory"
                    if [ "$ATTEMPT" = "1" ]; then git checkout -q main && git switch -q -C "agent/$ORDER"; else git checkout -q "agent/$ORDER"; fi
                    # The game's dependencies live in the image (/opt/hw): the line never installs from the network.
                    [ -e system/node_modules ] || ln -s /opt/hw/node_modules system/node_modules
                    # A fresh output directory for this attempt (an earlier run of the same work order may have left one).
                    mkdir -p "$OUT" && find "$OUT" -mindepth 1 ! -name order.json -delete
                    rm -rf .sdlc && mkdir -p .sdlc && : > /work/events.jsonl
                    if [ "$ATTEMPT" != "1" ]; then cp "/work/out/$ORDER/attempt-$((ATTEMPT - 1))/feedback.md" .sdlc/feedback.md && echo "report from attempt $((ATTEMPT - 1)) attached"; fi
                    if [ -f "$OUT/order.json" ]; then cp "$OUT/order.json" .sdlc/order.json; else python3 sdlc/orders.py "$ORDER" > .sdlc/order.json; fi
                    echo "work order: $(jq -r .title .sdlc/order.json) (attempt $ATTEMPT, branch $(git branch --show-current))"

    - name: intake
      inputs:
        parameters: [{name: order}, {name: attempt}, {name: source, value: file}]
      outputs:
        parameters:
          - name: accepted
            valueFrom: {parameter: "{{steps.run.outputs.parameters.accepted}}"}
      steps:
        - - name: run
            template: step-with-output
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    title=$(jq -r .title .sdlc/order.json); body=$(jq -r .body .sdlc/order.json)
                    python3 sdlc/context.py route --title "$title" --body "$body" --out-md .sdlc/route.md
                    python3 sdlc/intake.py --title "$title" --body "$body" --out-md .sdlc/intake.md
                    cp .sdlc/intake.md .sdlc/route.md "$OUT/"
                    if [ "$(cat /tmp/outputs/accepted)" != "true" ]; then echo "Work order sent back to its author: $OUT/intake.md"; fi
        # Finale: the questions of the `intake` agent land under the issue, where the author is.
        - - name: send-back
            template: step-github
            when: "{{inputs.parameters.source}} == github && {{steps.run.outputs.parameters.accepted}} != true"
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: python3 sdlc/github.py send-back --issue "${ORDER#issue-}" --file "$OUT/intake.md"

    - name: builder
      inputs:
        parameters: [{name: order}, {name: agent}, {name: attempt}, {name: variant, value: ""}]
      steps:
        - - name: run
            template: step
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: agent, value: "{{inputs.parameters.agent}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    title=$(jq -r .title .sdlc/order.json); body=$(jq -r .body .sdlc/order.json)
                    python3 sdlc/agent.py prompt --title "$title" --body "$body" > /dev/null
                    REPLAY_VARIANT="{{inputs.parameters.variant}}" python3 sdlc/agent.py run
                    python3 sdlc/tracing.py tools --events /work/events.jsonl || true
                    # The oracle: did the agent try to look into the scenarios? The server rejects the read but records the attempt.
                    if grep -q holdout.peek /work/events.jsonl 2>/dev/null; then echo "::warning:: the agent looked into scenarios/ (holdout.peek), recorded"; grep holdout.peek /work/events.jsonl > "$OUT/holdout-peek.jsonl"; fi
                    # The agent must not touch the gates or the oracle. The server rejects it, and here we check once more.
                    touched=$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -vE '^\.sdlc/|__pycache__' || true)
                    echo "$touched"
                    if echo "$touched" | grep -qE '^(sdlc/|platform/|system/architecture/|system/bugs/tests/|system/tools/bugs/|system/(eslint\.config\.js|package\.json|pnpm-lock\.yaml|tsconfig\.json|vitest\.config\.ts|vitest\.bugs\.config\.ts)$|scenarios/|\.github/|\.factory/)'; then echo "::error:: the agent changed the gates, the oracle or the workflows"; exit 1; fi
                    if [ -z "$touched" ]; then echo "::error:: the agent changed nothing"; exit 1; fi

    - name: change
      inputs:
        parameters: [{name: order}, {name: agent}, {name: attempt}]
      steps:
        - - name: run
            template: step
            arguments:
              parameters:
                - {name: order, value: "{{inputs.parameters.order}}"}
                - {name: agent, value: "{{inputs.parameters.agent}}"}
                - {name: attempt, value: "{{inputs.parameters.attempt}}"}
                - name: script
                  value: |
                    title=$(jq -r .title .sdlc/order.json)
                    git add -A system && git commit -q -m "agent($AGENT): $title (attempt $ATTEMPT)"
                    git format-patch -q main --stdout > "$OUT/change.patch"
                    cp .sdlc/pr-body.md "$OUT/description.md" 2>/dev/null || echo "A change generated by an agent." > "$OUT/description.md"
                    cp .sdlc/agent-events.jsonl "$OUT/" 2>/dev/null || true; cp /work/events.jsonl "$OUT/tools.jsonl" 2>/dev/null || true
                    echo "The change on branch agent/$ORDER: $(git rev-parse --short HEAD). Patch: $OUT/change.patch"; git show --stat HEAD | tail -n +5

    # A variant of the step with the output `accepted` (Argo reads the file).
    - name: step-with-output
      inputs:
        parameters: [{name: script}, {name: order}, {name: agent, value: kagent}, {name: attempt, value: "1"}]
      outputs:
        parameters:
          - name: accepted
            valueFrom: {path: /tmp/outputs/accepted, default: "false"}
      container:
        image: factory-toolbox:lesson
        imagePullPolicy: IfNotPresent
        command: [bash, -eo, pipefail, -c]
        args: ["mkdir -p /tmp/outputs; t0=$(date +%s%N); trap 'python3 sdlc/tracing.py step --start $t0 --exit $? 2>/dev/null || true' EXIT; {{inputs.parameters.script}}"]
        workingDir: /work/repo
        env:
          - {name: ORDER, value: "{{inputs.parameters.order}}"}
          - {name: AGENT, value: "{{inputs.parameters.agent}}"}
          - {name: ATTEMPT, value: "{{inputs.parameters.attempt}}"}
          - {name: FACTORY_RUN, value: "{{workflow.name}}"}
          - name: FACTORY_NODE
            valueFrom: {fieldRef: {fieldPath: "metadata.annotations['workflows.argoproj.io/node-name']"}}
          - {name: OUT, value: "/work/out/{{inputs.parameters.order}}/attempt-{{inputs.parameters.attempt}}"}
          - {name: OUTPUTS_DIR, value: /tmp/outputs}
          - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          - {name: KAGENT_URL, value: "http://kagent-controller.kagent.svc:8083"}
          - {name: KAGENT_NS, value: factory}
          - {name: A2A_USER, value: "line@factory"}
        volumeMounts: [{name: work, mountPath: /work}]
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 2Gi}
